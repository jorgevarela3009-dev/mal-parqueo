<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mal parqueo en Santa Marta</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <style>
    :root { --fondo:#f6f7f5; --texto:#1d2a2e; --acento:#0b6e75; --borde:#cfd6d4; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; font-family: system-ui, sans-serif; color: var(--texto); background: var(--fondo); }
    body { display: flex; flex-direction: column; }
    header { padding: .6rem 1rem; border-bottom: 1px solid var(--borde); display: flex; flex-wrap: wrap; gap: .5rem 1.2rem; align-items: center; }
    h1 { font-size: 1.1rem; margin: 0; }
    label { font-size: .9rem; display: flex; align-items: center; gap: .4rem; }
    button { font: inherit; padding: .6rem 1rem; border: 0; border-radius: 6px; background: var(--acento); color: #fff; cursor: pointer; }
    button.sec { background: #fff; color: var(--acento); border: 1px solid var(--acento); }
    #mapa { flex: 1; min-height: 240px; }
    #panel { padding: .8rem 1rem; border-top: 1px solid var(--borde); display: grid; gap: .6rem; max-width: 640px; width: 100%; margin: 0 auto; }
    #panel[hidden] { display: none; }
    #panel select, #panel input[type=datetime-local] { font: inherit; font-size: 16px; padding: .55rem; width: 100%; border: 1px solid var(--borde); border-radius: 6px; }
    .fila { display: flex; gap: .6rem; flex-wrap: wrap; align-items: center; }
    #msg { font-size: .9rem; min-height: 1.2em; }
  </style>
</head>
<body>
  <header>
    <h1>Mal parqueo e invasión de espacio público</h1>
    <label><input type="checkbox" id="chk-calor" checked> Mapa de calor</label>
    <label><input type="checkbox" id="chk-puntos" checked> Puntos</label>
    <span id="conteo"></span>
    <button type="button" id="btn-abrir">Reportar</button>
  </header>
  <div id="mapa"></div>

  <div id="panel" hidden>
    <div class="fila">
      <button type="button" id="btn-gps">Usar mi ubicación</button>
      <span>o toca el mapa donde está la obstrucción</span>
    </div>
    <select id="f-categoria"></select>
    <select id="f-actor"></select>
    <select id="f-via" hidden>
      <option value="">Tipo de vía (no se pudo detectar)</option>
      <option value="arterial">Arterial</option>
      <option value="secundaria">Secundaria</option>
    </select>
    <input type="datetime-local" id="f-hora">
    <label><input type="checkbox" id="f-campo"> Es un registro de campo del equipo</label>
    <div class="fila">
      <button type="button" id="btn-guardar">Guardar reporte</button>
      <button type="button" class="sec" id="btn-cerrar">Cerrar</button>
    </div>
    <div id="msg"></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.heat/0.2.0/leaflet-heat.js"></script>
  <script src="criticidad.js"></script>
  <script src="via.js"></script>
  <script src="mapa.js"></script>
  <script src="captura.js"></script>
</body>
</html>
